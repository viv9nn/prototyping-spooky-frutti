<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd Jobs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 320x180 screen in the Spooky Frutti Arcade palette, touch pad below it on phones. */
:root {
  color-scheme: dark;
  --ink: #1c1440;
  --window: #24287e;
  --white: #fdfbff;
  --pink: #ff8fc0;
  --pink-deep: #e8487f;
  --yellow: #ffe680;
  --mono: "DotGothic16", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: conic-gradient(#2a2058 25%, #231a4c 0 50%, #2a2058 0 75%, #231a4c 0) 0 0 / 32px 32px;
  color: var(--white);
  font-family: var(--mono);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
#screen {
  display: block;
  max-width: 100%;
  background: #000;
  outline: 4px solid var(--white);
  touch-action: none;
  cursor: pointer;
}
#screen:focus-visible { outline-color: var(--yellow); }
.embed #help { display: none; }
.embed #screen { outline: 0; }
.embed body { padding: 0; gap: 0; }
#help { color: var(--white); text-align: center; margin: 0; }
#help kbd { font: inherit; color: var(--yellow); }
#pad { display: none; width: 100%; max-width: 420px; justify-content: space-between; align-items: center; gap: 12px; }
#dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 48px); gap: 4px; }
#pad button {
  font: 700 18px var(--mono);
  color: var(--white);
  background: var(--window);
  border: 0;
  border-radius: 0;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.1);
  touch-action: none;
}
#pad button.on { background: var(--pink-deep); }
#pad button:focus-visible { outline: 2px solid var(--yellow); }
#ba { width: 96px; height: 96px; border-radius: 50% !important; background: var(--pink-deep) !important; color: var(--white) !important; }
@media (pointer: coarse) {
  #pad { display: flex; }
  #help { display: none; }
}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<canvas id="screen" width="1280" height="720" tabindex="0" aria-label="Odd Jobs game screen"></canvas>
<p id="help"><kbd>Arrows</kbd> or <kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd> act &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> mute</p>
<div id="pad" aria-label="Touch controls">
  <div id="dpad">
    <span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span>
    <button data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button data-k="right" aria-label="Right">&#9654;</button>
  </div>
  <button id="ba" data-k="a">GO</button>
</div>

<script>
'use strict';
/* ------------------------------------------------------------------ core */
const W = 320, H = 180;
const cv = document.getElementById('screen');
const g = cv.getContext('2d');
const SCALE = cv.width / W;
g.imageSmoothingEnabled = false;
g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
const embedded = new URLSearchParams(location.search).has('embed');
if (embedded) document.documentElement.classList.add('embed');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit() {
  const coarse = getComputedStyle(document.getElementById('pad')).display !== 'none';
  const pad = coarse ? 190 : embedded ? 0 : 44;
  const aw = Math.max(160, innerWidth - (embedded ? 0 : 40)), ah = Math.max(90, innerHeight - pad);
  let s = Math.min(aw / W, ah / H);
  if (s >= 2 && !embedded) s = Math.floor(s);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = n => '$' + Math.max(0, Math.round(n)).toLocaleString('en-US');
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function layer(draw, w = W, h = H) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const r = (a, b, d, e, f) => { x.fillStyle = f; x.fillRect(a | 0, b | 0, d | 0, e | 0); };
  draw(r, x); return c;
}

/* ---------------------------------------------------------------- text, in the site's font */
const FONT = '"DotGothic16", ui-monospace, Menlo, Consolas, monospace';
const ARROWS = { '<': '\u25C0', '>': '\u25B6', '^': '\u25B2', '_': '\u25BC' };
const label = s => String(s).toLowerCase().replace(/(^|[.!?:♥]\s+)(\p{L})/gu, (m, a, b) => a + b.toUpperCase()).replace(/[<>^_]/g, c => ARROWS[c]);
function tw(s, sc = 1) { g.font = 8 * sc + 'px ' + FONT; return g.measureText(label(s)).width; }
function text(s, x, y, c = '#fff', o = {}) {
  const sc = o.s || 1, str = label(s);
  g.font = 8 * sc + 'px ' + FONT; g.textBaseline = 'top';
  if (o.c) x -= g.measureText(str).width / 2; else if (o.r) x -= g.measureText(str).width;
  x = Math.round(x); y = Math.round(y - 1.5 * sc);
  if (o.sh) { g.fillStyle = o.sh; g.fillText(str, x + .5 * sc, y + .5 * sc); }
  g.fillStyle = c; g.fillText(str, x, y);
}
if (document.fonts) document.fonts.load('32px "DotGothic16"');
function wrap(s, maxw) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (tw(t) > maxw) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* ---------------------------------------------------------------- input */
const held = {}, hit = {};
const KEYMAP = {
  ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'a',Enter:'a',KeyP:'p',Escape:'q',KeyQ:'q',KeyM:'m',KeyR:'r'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); audioOn();
  if (!e.repeat) { held[k] = true; hit[k] = true; }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; if (scene && scene.onBlur) scene.onBlur(); });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioOn(); held[k] = true; hit[k] = true; b.classList.add('on'); });
  const up = () => { held[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
let mouse = null;
function toScreen(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => { audioOn(); cv.focus(); mouse = toScreen(e); });

/* ---------------------------------------------------------------- audio */
let ac = null, muted = false, musicStep = 0, nextNote = 0, master = null;
function audioOn() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try {
    ac = new C(); master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
    nextNote = ac.currentTime + .05; setInterval(schedule, 30);
  } catch (e) { ac = null; }
}
function tone(f, d, type = 'square', v = .12, when = 0, slide = 0) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), a = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(a); a.connect(master); o.start(t); o.stop(t + d + .02);
}
let noiseBuf = null;
function noise(d, v = .1, when = 0, hp = 1000) {
  if (!ac) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const n = noiseBuf.getChannelData(0); for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), a = ac.createGain(), f = ac.createBiquadFilter(), t = ac.currentTime + when;
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f); f.connect(a); a.connect(master); s.start(t); s.stop(t + d + .02);
}
const SFX = {
  move: () => tone(420, .05, 'square', .06),
  ok: () => { tone(660, .06); tone(990, .08, 'square', .1, .05); },
  coin: () => { tone(988, .05, 'square', .09); tone(1319, .12, 'square', .09, .05); },
  bad: () => tone(170, .22, 'sawtooth', .16, 0, -90),
  whack: () => { noise(.1, .22, 0, 400); tone(140, .1, 'square', .14, 0, -70); },
  click: () => { noise(.03, .2, 0, 3000); tone(1800, .03, 'square', .06); },
  siren: () => { for (let i = 0; i < 3; i++) { tone(700, .14, 'square', .07, i * .28, 400); tone(1100, .14, 'square', .07, i * .28 + .14, -400); } },
  bust: () => { tone(440, .16, 'sawtooth', .16, 0); tone(370, .16, 'sawtooth', .16, .16); tone(311, .16, 'sawtooth', .16, .32); tone(220, .5, 'sawtooth', .18, .48, -100); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .12, i * .08)),
  go: () => tone(880, .22, 'square', .12),
  tick: () => tone(520, .08, 'square', .1),
  crash: () => { noise(.3, .3, 0, 200); tone(90, .3, 'sawtooth', .18, 0, -40); },
  shred: () => { noise(.14, .14, 0, 2000); }
};
const sfx = n => { if (ac && !muted) SFX[n](); };
/* The backing track: an original 90s-style boom-bap loop in D minor, one chord per bar.
   To use a licensed recording instead, set BACKING_TRACK to its path next to this file. */
const BACKING_TRACK = null;
const BPM = 92, SWING = .2;
const CHORDS = [[50, 53, 57, 60], [46, 50, 53, 57], [43, 46, 50, 53], [45, 49, 52, 55]];
const KICK = [0, 7, 10], SNARE = [4, 12], BASS = [0, 3, 6, 10, 11], STAB = [2, 9, 14];
const HOOK = { 32: 69, 35: 72, 38: 74, 42: 72, 44: 69, 48: 65, 51: 67, 54: 69, 58: 64 };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let trackEl = null;
function schedule() {
  if (!ac || muted || paused()) { if (ac) nextNote = Math.max(nextNote, ac.currentTime); if (trackEl) trackEl.pause(); return; }
  if (BACKING_TRACK) { if (!trackEl) { trackEl = new Audio(BACKING_TRACK); trackEl.loop = true; trackEl.volume = .6; } if (trackEl.paused) trackEl.play().catch(() => {}); return; }
  const spb = 60 / BPM / 4;
  while (nextNote < ac.currentTime + .12) {
    const i = musicStep % 64, st = i % 16, ch = CHORDS[i >> 4], at = Math.max(0, nextNote - ac.currentTime) + (i % 2 ? spb * SWING : 0);
    if (KICK.includes(st)) tone(115, .2, 'sine', .42, at, -70);
    if (SNARE.includes(st)) { noise(.15, .17, at, 1400); tone(185, .08, 'triangle', .1, at); }
    if (st % 2 === 0) noise(.03, st === 14 ? .05 : .03, at, 7000);
    if (BASS.includes(st)) tone(midi(ch[0] - 12), spb * 1.8, 'triangle', .3, at);
    if (STAB.includes(st)) ch.slice(1).forEach(n => { tone(midi(n + 12), .2, 'triangle', .045, at); tone(midi(n + 12) * 1.004, .14, 'square', .009, at); });
    if (HOOK[i]) tone(midi(HOOK[i]), spb * 2.4, 'triangle', .06, at);
    musicStep++; nextNote += spb;
  }
}
const paused = () => scene && scene.isPaused && scene.isPaused();

/* ---------------------------------------------------------------- save */
/* Money is shared with the site. On the site, changes go to lib/wallet.ts through the
   frame's parent; the site's storage events bring the saved value back here. */
const MONEY_KEY = 'arcade-money';
let cash = null;
const toSite = msg => parent.postMessage(msg, location.origin);
function getMoney() {
  if (cash === null) {
    let saved = 0;
    try { saved = Number(localStorage.getItem(MONEY_KEY)); } catch (e) {}
    cash = Number.isSafeInteger(saved) && saved >= 0 ? saved : 0;
  }
  return cash;
}
function setMoney(n) {
  const next = Math.max(0, Math.round(n)), amount = next - getMoney();
  cash = next;
  if (embedded) { if (amount) toSite({ type: 'money', amount }); return; }
  try { localStorage.setItem(MONEY_KEY, String(next)); } catch (e) {}
}
function addMoney(n) { if (n > 0) setMoney(getMoney() + Math.round(n)); }
function spendMoney(n) { if (n > getMoney()) return false; if (n > 0) setMoney(getMoney() - n); return true; }
addEventListener('storage', e => { if (e.key === MONEY_KEY || e.key === null) cash = null; });

const SAVE_KEY = 'spooky-frutti-v2';
let save = { rep: {}, best: {}, busts: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------------------------------------------------------- effects */
let floats = [], parts = [], shake = 0, flash = 0, flashCol = '#fff';
function pop(txt, x, y, c = '#ffe680') { floats.push({ txt, x, y, c, t: 1 }); }
function burst(x, y, n, cols, sp = 60) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-sp, sp), vy: rand(-sp * 1.3, sp * .2), c: pick(cols), t: rand(.3, .8) });
}
const coins = (x, y, n = 8) => burst(x, y, n, ['#ffe680', '#ffb52e', '#7fe07a']);
function bump(a = 3) { if (!reduced) shake = Math.max(shake, a); }
function flashOn(c, a = .5) { if (!reduced) { flash = a; flashCol = c; } }
function fxUpdate(dt) {
  floats = floats.filter(f => (f.t -= dt * .9) > 0); floats.forEach(f => f.y -= dt * 24);
  parts = parts.filter(p => (p.t -= dt) > 0); parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; });
  shake = Math.max(0, shake - dt * 12); flash = Math.max(0, flash - dt * 2);
}
function fxDraw() {
  parts.forEach(p => R(p.x, p.y, 2, 2, p.c));
  floats.forEach(f => { const hw = tw(f.txt) / 2 + 2; text(f.txt, clamp(f.x, hw, W - hw), f.y, f.c, { c: 1, sh: '#000' }); });
}

/* ---------------------------------------------------------------- sprites */
function sprite(rows, pal) {
  return layer(r => rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = pal[row[x]]; if (c) r(x, y, 1, 1, c); } }), rows[0].length, rows.length);
}
const OUT = '#2a0612';
const HEAD_PAL = { K: OUT, r: '#ad2c4a', d: '#8e1a38', l: '#d4627a', h: '#f0a0b0', S: '#f4ecd8', E: '#2a0612', n: '#6e4a24', m: '#2a0612', B: '#46081f', g: '#4fa877', G: '#2f7a58' };
const HEAD = sprite([
  '......gGg..n......',
  '...KgGGGgKnKKK....',
  '..KlgggrrKKrrrrK..',
  '.KlhlrrrrrrrrrrdK.',
  '.KhlrrrrrrrrrrrdK.',
  'KllrrrrrrrrrrrrrdK',
  'KlBBBBrrrrrrBBBBdK',
  'KrrSSEErrrrrSSErdK',
  'KrrddrrrrrrrddrrdK',
  'KrrrrrrrrrrrrrrrdK',
  '.KrrrrmmmmmmrrddK.',
  '.KdrrmrrrrrrmrddK.',
  '..KddrrrrrrrdddK..',
  '...KKdddddddKKK...',
  '.....KKKKKKK......'
], HEAD_PAL);
const MINI = sprite([
  '....g.n....',
  '..KKKnKKK..',
  '.KllrrrrrK.',
  'KlhrrrrrrdK',
  'KBBBrrrBBdK',
  'KrSErrrSEdK',
  'KrrrrrrrrdK',
  'KrrmmmmmrdK',
  '.KmrrrrrmK.',
  '..KKKKKKK..'
], HEAD_PAL);

function frutti(x, y, o = {}) {
  x = Math.round(x); y = Math.round(y);
  const st = o.step ? (Math.floor(o.step * 8) % 2) : -1;
  const lL = st === 0 ? 1 : 0, lR = st === 1 ? 1 : 0, fit = o.outfit;
  const LOOK = {
    deal: ['#2f3346', '#23242f'], fraud: ['#22304f', '#1a2640'], heist: ['#e8e8f0', '#15151f'],
    pimp: ['#6d2bb0', '#4c1a85'], gamble: ['#16161f', '#16161f']
  }[fit] || ['#f4ecd8', '#cfae68'];
  const [top, legs] = LOOK, skin = '#8e1a38';
  // canvas shoes
  R(x - 7, y - 3 - lL, 6, 3, OUT); R(x - 6, y - 3 - lL, 4, 2, '#f4ecd8');
  R(x + 1, y - 3 - lR, 6, 3, OUT); R(x + 2, y - 3 - lR, 4, 2, '#f4ecd8');
  // trousers
  R(x - 5, y - 10, 4, 7 - lL, legs); R(x + 1, y - 10, 4, 7 - lR, legs); R(x - 5, y - 11, 10, 2, legs); R(x - 1, y - 8, 1, 5, '#00000040');
  // shirt, rolled sleeves, bare forearms
  R(x - 6, y - 17, 12, 7, top);
  R(x - 8, y - 17, 2, 3, top); R(x + 6, y - 17, 2, 3, top);
  R(x - 8, y - 14, 2, 4, skin); R(x + 6, y - 14, 2, 4, skin); R(x - 8, y - 10, 2, 2, '#6e102c'); R(x + 6, y - 10, 2, 2, '#6e102c');
  if (!fit) { R(x, y - 15, 1, 5, '#e8dec6'); R(x - 2, y - 16, 4, 1, skin); }
  if (fit === 'dogs') { R(x, y - 15, 1, 1, '#e8dec6'); R(x - 5, y - 15, 10, 8, '#ffffff'); R(x - 5, y - 15, 10, 1, '#d8304a'); }
  if (fit === 'deal') { R(x - 2, y - 13, 4, 2, '#454b66'); }
  if (fit === 'pimp') { R(x - 9, y - 17, 18, 13, '#6d2bb0'); R(x - 10, y - 17, 3, 13, '#ff8fc0'); R(x + 7, y - 17, 3, 13, '#ff8fc0'); R(x - 10, y - 5, 20, 2, '#ff8fc0'); R(x - 3, y - 16, 6, 1, '#ffe680'); R(x - 1, y - 15, 2, 2, '#ffe680'); }
  if (fit === 'heist') { for (let i = 0; i < 3; i++) R(x - 6, y - 16 + i * 2, 12, 1, '#15151f'); }
  if (fit === 'fraud') { R(x - 2, y - 17, 4, 6, '#ffffff'); R(x - 1, y - 17, 2, 6, '#d8304a'); }
  if (fit === 'gamble') { R(x - 2, y - 17, 4, 7, '#ffffff'); R(x - 2, y - 17, 4, 2, '#ffe680'); }
  // head
  g.drawImage(HEAD, x - 9, y - 31);
  const eye = y - 24;
  if (fit === 'dogs') { R(x - 7, y - 34, 14, 5, '#ffffff'); R(x - 7, y - 31, 14, 1, '#d8304a'); R(x - 5, y - 36, 10, 2, '#ffffff'); }
  if (fit === 'deal') { R(x - 8, y - 33, 16, 5, '#2f3346'); R(x - 8, y - 30, 16, 1, '#454b66'); R(x - 8, eye, 7, 2, '#0a0a10'); R(x + 1, eye, 7, 2, '#0a0a10'); R(x - 1, eye, 2, 1, '#0a0a10'); }
  if (fit === 'pimp') {
    R(x - 14, y - 32, 28, 2, '#9a4ce8'); R(x - 7, y - 38, 14, 6, '#8a3fd8'); R(x - 7, y - 34, 14, 2, '#ffe680');
    R(x + 6, y - 43, 2, 7, '#ff8fc0'); R(x + 8, y - 44, 1, 4, '#ff8fc0');
    R(x - 8, eye, 7, 2, '#0a0a10'); R(x + 1, eye, 7, 2, '#0a0a10'); R(x - 1, eye, 2, 1, '#ffe680');
  }
  if (fit === 'heist') { R(x - 8, y - 33, 16, 5, '#15151f'); R(x - 8, y - 25, 16, 3, '#15151f'); R(x - 6, eye, 3, 1, '#fff'); R(x + 3, eye, 3, 1, '#fff'); }
  if (fit === 'fraud') { R(x - 8, eye - 1, 7, 1, '#ffe680'); R(x + 1, eye - 1, 7, 1, '#ffe680'); R(x - 8, eye + 2, 7, 1, '#ffe680'); R(x + 1, eye + 2, 7, 1, '#ffe680'); R(x - 1, eye, 2, 1, '#ffe680'); }
  if (fit === 'gamble') { R(x - 9, y - 29, 18, 2, '#2f9a5a'); R(x - 9, y - 27, 18, 1, '#16643a'); }
}
function fruttiBig(x, y, sc, o) { g.save(); g.translate(x, y); g.scale(sc, sc); frutti(0, 0, o); g.restore(); }

/* fruit NPCs */
const SHAPES = {

/* Repaints a scene with Hold It In's cafe palette and ordered dithering. */
const DUSK = ["#7f4d9f", "#5f3f97", "#2c2266", "#2d1433", "#5b3176", "#51296c", "#e8b9a0", "#46223f", "#623176", "#6e3a80", "#5c3f97", "#463289", "#a85f97", "#7b4c96", "#6a3f9c", "#54293f", "#3a2d7a", "#2b2a45", "#b4569f", "#3b1c3e", "#6a3640", "#8a5240", "#3f1f3f", "#f3dcc8", "#e8487f", "#e8c9b8", "#1c1440", "#7c4545", "#fdfbff", "#a85a48", "#b87850", "#3b8a68", "#ffd76e", "#f07f9f", "#ff8fc0", "#fff3c0", "#4fa877", "#d8d4f0", "#9a5a48", "#ffe680", "#42265f", "#4a2a68", "#f4e6f4", "#834587", "#753b7e", "#c97258", "#a2619a", "#ffe6c0", "#fdf0e2", "#8fd6a8", "#ffffff", "#7fd69a"].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dusk(c) {
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data, seen = new Map();
  for (let i = 0; i < d.length; i += 4) {
    const px = (i / 4) % c.width, py = (i / 4 / c.width) | 0, n = (BAYER[(py % 4) * 4 + px % 4] / 16 - .5) * 34;
    const r = d[i] + n, gr = d[i + 1] + n, b = d[i + 2] + n, key = (r & 255) << 16 | (gr & 255) << 8 | (b & 255);
    let hit = seen.get(key);
    if (!hit) {
      let best = 1e9;
      for (const p of DUSK) { const e = (r - p[0]) ** 2 * 2 + (gr - p[1]) ** 2 * 4 + (b - p[2]) ** 2 * 3; if (e < best) { best = e; hit = p; } }
      seen.set(key, hit);
    }
    d[i] = hit[0]; d[i + 1] = hit[1]; d[i + 2] = hit[2];
  }
  x.putImageData(im, 0, 0);
  return c;
}

  g.setTransform(SCALE, 0, 0, SCALE, sx * SCALE, sy * SCALE);

  for (const k in hit) hit[k] = false;
