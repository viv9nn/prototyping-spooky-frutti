<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd Jobs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 320x180 screen in the Spooky Frutti Arcade palette, touch pad below it on phones. */
:root {
  color-scheme: dark;
  --ink: #1c1440;
  --window: #24287e;
  --white: #fdfbff;
  --pink: #ff8fc0;
  --pink-deep: #e8487f;
  --yellow: #ffe680;
  --mono: "DotGothic16", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: conic-gradient(#2a2058 25%, #231a4c 0 50%, #2a2058 0 75%, #231a4c 0) 0 0 / 32px 32px;
  color: var(--white);
  font-family: var(--mono);
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
#screen {
  display: block;
  max-width: 100%;
  image-rendering: pixelated;
  background: #000;
  outline: 4px solid var(--white);
  touch-action: none;
  cursor: pointer;
}
#screen:focus-visible { outline-color: var(--yellow); }
.embed #help { display: none; }
.embed #screen { outline: 0; }
.embed body { padding: 0; gap: 0; }
#help { color: var(--white); text-align: center; margin: 0; }
#help kbd { font: inherit; color: var(--yellow); }
#pad { display: none; width: 100%; max-width: 420px; justify-content: space-between; align-items: center; gap: 12px; }
#dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 48px); gap: 4px; }
#pad button {
  font: 700 18px var(--mono);
  color: var(--white);
  background: var(--window);
  border: 0;
  border-radius: 0;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.1);
  touch-action: none;
}
#pad button.on { background: var(--pink-deep); }
#pad button:focus-visible { outline: 2px solid var(--yellow); }
#ba { width: 96px; height: 96px; border-radius: 50% !important; background: var(--pink-deep) !important; color: var(--white) !important; }
@media (pointer: coarse) {
  #pad { display: flex; }
  #help { display: none; }
}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<canvas id="screen" width="320" height="180" tabindex="0" aria-label="Odd Jobs game screen"></canvas>
<p id="help"><kbd>Arrows</kbd> or <kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd> act &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> mute</p>
<div id="pad" aria-label="Touch controls">
  <div id="dpad">
    <span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span>
    <button data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button data-k="right" aria-label="Right">&#9654;</button>
  </div>
  <button id="ba" data-k="a">GO</button>
</div>

<script>
'use strict';
/* ------------------------------------------------------------------ core */
const W = 320, H = 180;
const cv = document.getElementById('screen');
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const embedded = new URLSearchParams(location.search).has('embed');
if (embedded) document.documentElement.classList.add('embed');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit() {
  const coarse = getComputedStyle(document.getElementById('pad')).display !== 'none';
  const pad = coarse ? 190 : embedded ? 0 : 44;
  const aw = Math.max(160, innerWidth - (embedded ? 0 : 40)), ah = Math.max(90, innerHeight - pad);
  let s = Math.min(aw / W, ah / H);
  if (s >= 2 && !embedded) s = Math.floor(s);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = n => '$' + Math.max(0, Math.round(n)).toLocaleString('en-US');
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function layer(draw, w = W, h = H) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const r = (a, b, d, e, f) => { x.fillStyle = f; x.fillRect(a | 0, b | 0, d | 0, e | 0); };
  draw(r, x); return c;
}

/* ---------------------------------------------------------------- pixel font */
const GLYPHS = {
  A:'010 101 111 101 101',B:'110 101 110 101 110',C:'011 100 100 100 011',D:'110 101 101 101 110',E:'111 100 110 100 111',
  F:'111 100 110 100 100',G:'011 100 101 101 011',H:'101 101 111 101 101',I:'111 010 010 010 111',J:'001 001 001 101 010',
  K:'101 101 110 101 101',L:'100 100 100 100 111',M:'10001 11011 10101 10001 10001',N:'1001 1101 1011 1001 1001',O:'010 101 101 101 010',
  P:'110 101 110 100 100',Q:'010 101 101 110 011',R:'110 101 110 101 101',S:'011 100 010 001 110',T:'111 010 010 010 010',
  U:'101 101 101 101 111',V:'101 101 101 101 010',W:'10001 10001 10101 11011 10001',X:'101 101 010 101 101',Y:'101 101 010 010 010',Z:'111 001 010 100 111',
  0:'111 101 101 101 111',1:'010 110 010 010 111',2:'110 001 010 100 111',3:'110 001 010 001 110',4:'101 101 111 001 001',
  5:'111 100 110 001 110',6:'011 100 111 101 111',7:'111 001 010 010 010',8:'111 101 111 101 111',9:'111 101 111 001 110',
  '\u2665':'01010 11111 11111 01110 00100','$':'011 110 010 011 110','.':'0 0 0 0 1',',':'00 00 00 01 10','!':'1 1 1 0 1','?':'110 001 010 000 010',':':'0 1 0 1 0',
  '-':'000 000 111 000 000','+':'000 010 111 010 000','/':'001 001 010 100 100','%':'101 001 010 100 101',"'":'1 1 0 0 0',
  '(':'01 10 10 10 01',')':'10 01 01 01 10','*':'000 101 010 101 000','>':'100 110 111 110 100','<':'001 011 111 011 001',
  '^':'010 111 111 010 010','_':'010 010 111 111 010','#':'111 111 111 111 111','=':'000 111 000 111 000',' ':'000 000 000 000 000'
};
for (const k in GLYPHS) GLYPHS[k] = GLYPHS[k].split(' ');
function tw(s, sc = 1) {
  let w = 0; for (const ch of String(s).toUpperCase()) w += ((GLYPHS[ch] || GLYPHS[' '])[0].length + 1) * sc;
  return w - sc;
}
function text(s, x, y, c = '#fff', o = {}) {
  const sc = o.s || 1; s = String(s).toUpperCase();
  if (o.c) x -= tw(s, sc) / 2; else if (o.r) x -= tw(s, sc);
  x = Math.round(x); y = Math.round(y);
  if (o.sh) text(s, x + sc, y + sc, o.sh, { s: sc });
  g.fillStyle = c;
  for (const ch of s) {
    const gl = GLYPHS[ch] || GLYPHS[' '];
    for (let r = 0; r < 5; r++) for (let i = 0; i < gl[r].length; i++)
      if (gl[r][i] === '1') g.fillRect(x + i * sc, y + r * sc, sc, sc);
    x += (gl[0].length + 1) * sc;
  }
}
function wrap(s, maxw) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (tw(t) > maxw) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* ---------------------------------------------------------------- input */
const held = {}, hit = {};
const KEYMAP = {
  ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'a',Enter:'a',KeyP:'p',Escape:'q',KeyQ:'q',KeyM:'m',KeyR:'r'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); audioOn();
  if (!e.repeat) { held[k] = true; hit[k] = true; }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; if (scene && scene.onBlur) scene.onBlur(); });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioOn(); held[k] = true; hit[k] = true; b.classList.add('on'); });
  const up = () => { held[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
let mouse = null;
function toScreen(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => { audioOn(); cv.focus(); mouse = toScreen(e); });

/* ---------------------------------------------------------------- audio */
let ac = null, muted = false, musicStep = 0, nextNote = 0, master = null;
function audioOn() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try {
    ac = new C(); master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
    nextNote = ac.currentTime + .05; setInterval(schedule, 30);
  } catch (e) { ac = null; }
}
function tone(f, d, type = 'square', v = .12, when = 0, slide = 0) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), a = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(a); a.connect(master); o.start(t); o.stop(t + d + .02);
}
let noiseBuf = null;
function noise(d, v = .1, when = 0, hp = 1000) {
  if (!ac) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate); const n = noiseBuf.getChannelData(0); for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), a = ac.createGain(), f = ac.createBiquadFilter(), t = ac.currentTime + when;
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f); f.connect(a); a.connect(master); s.start(t); s.stop(t + d + .02);
}
const SFX = {
  move: () => tone(420, .05, 'square', .06),
  ok: () => { tone(660, .06); tone(990, .08, 'square', .1, .05); },
  coin: () => { tone(988, .05, 'square', .09); tone(1319, .12, 'square', .09, .05); },
  bad: () => tone(170, .22, 'sawtooth', .16, 0, -90),
  whack: () => { noise(.1, .22, 0, 400); tone(140, .1, 'square', .14, 0, -70); },
  click: () => { noise(.03, .2, 0, 3000); tone(1800, .03, 'square', .06); },
  siren: () => { for (let i = 0; i < 3; i++) { tone(700, .14, 'square', .07, i * .28, 400); tone(1100, .14, 'square', .07, i * .28 + .14, -400); } },
  bust: () => { tone(440, .16, 'sawtooth', .16, 0); tone(370, .16, 'sawtooth', .16, .16); tone(311, .16, 'sawtooth', .16, .32); tone(220, .5, 'sawtooth', .18, .48, -100); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .12, i * .08)),
  go: () => tone(880, .22, 'square', .12),
  tick: () => tone(520, .08, 'square', .1),
  crash: () => { noise(.3, .3, 0, 200); tone(90, .3, 'sawtooth', .18, 0, -40); },
  shred: () => { noise(.14, .14, 0, 2000); }
};
const sfx = n => { if (ac && !muted) SFX[n](); };
/* The backing track: an original 90s-style boom-bap loop in D minor, one chord per bar.
   To use a licensed recording instead, set BACKING_TRACK to its path next to this file. */
const BACKING_TRACK = null;
const BPM = 92, SWING = .2;
const CHORDS = [[50, 53, 57, 60], [46, 50, 53, 57], [43, 46, 50, 53], [45, 49, 52, 55]];
const KICK = [0, 7, 10], SNARE = [4, 12], BASS = [0, 3, 6, 10, 11], STAB = [2, 9, 14];
const HOOK = { 32: 69, 35: 72, 38: 74, 42: 72, 44: 69, 48: 65, 51: 67, 54: 69, 58: 64 };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let trackEl = null;
function schedule() {
  if (!ac || muted || paused()) { if (ac) nextNote = Math.max(nextNote, ac.currentTime); if (trackEl) trackEl.pause(); return; }
  if (BACKING_TRACK) { if (!trackEl) { trackEl = new Audio(BACKING_TRACK); trackEl.loop = true; trackEl.volume = .6; } if (trackEl.paused) trackEl.play().catch(() => {}); return; }
  const spb = 60 / BPM / 4;
  while (nextNote < ac.currentTime + .12) {
    const i = musicStep % 64, st = i % 16, ch = CHORDS[i >> 4], at = Math.max(0, nextNote - ac.currentTime) + (i % 2 ? spb * SWING : 0);
    if (KICK.includes(st)) tone(115, .2, 'sine', .42, at, -70);
    if (SNARE.includes(st)) { noise(.15, .17, at, 1400); tone(185, .08, 'triangle', .1, at); }
    if (st % 2 === 0) noise(.03, st === 14 ? .05 : .03, at, 7000);
    if (BASS.includes(st)) tone(midi(ch[0] - 12), spb * 1.8, 'triangle', .3, at);
    if (STAB.includes(st)) ch.slice(1).forEach(n => { tone(midi(n + 12), .2, 'triangle', .045, at); tone(midi(n + 12) * 1.004, .14, 'square', .009, at); });
    if (HOOK[i]) tone(midi(HOOK[i]), spb * 2.4, 'triangle', .06, at);
    musicStep++; nextNote += spb;
  }
}
const paused = () => scene && scene.isPaused && scene.isPaused();

/* ---------------------------------------------------------------- save */
/* Money is shared with the site. On the site, changes go to lib/wallet.ts through the
   frame's parent; the site's storage events bring the saved value back here. */
const MONEY_KEY = 'arcade-money';
let cash = null;
const toSite = msg => parent.postMessage(msg, location.origin);
function getMoney() {
  if (cash === null) {
    let saved = 0;
    try { saved = Number(localStorage.getItem(MONEY_KEY)); } catch (e) {}
    cash = Number.isSafeInteger(saved) && saved >= 0 ? saved : 0;
  }
  return cash;
}
function setMoney(n) {
  const next = Math.max(0, Math.round(n)), amount = next - getMoney();
  cash = next;
  if (embedded) { if (amount) toSite({ type: 'money', amount }); return; }
  try { localStorage.setItem(MONEY_KEY, String(next)); } catch (e) {}
}
function addMoney(n) { if (n > 0) setMoney(getMoney() + Math.round(n)); }
function spendMoney(n) { if (n > getMoney()) return false; if (n > 0) setMoney(getMoney() - n); return true; }
addEventListener('storage', e => { if (e.key === MONEY_KEY || e.key === null) cash = null; });

const SAVE_KEY = 'spooky-frutti-v2';
let save = { rep: {}, best: {}, busts: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------------------------------------------------------- effects */
let floats = [], parts = [], shake = 0, flash = 0, flashCol = '#fff';
function pop(txt, x, y, c = '#ffe680') { floats.push({ txt, x, y, c, t: 1 }); }
function burst(x, y, n, cols, sp = 60) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-sp, sp), vy: rand(-sp * 1.3, sp * .2), c: pick(cols), t: rand(.3, .8) });
}
const coins = (x, y, n = 8) => burst(x, y, n, ['#ffe680', '#ffb52e', '#7fe07a']);
function bump(a = 3) { if (!reduced) shake = Math.max(shake, a); }
function flashOn(c, a = .5) { if (!reduced) { flash = a; flashCol = c; } }
function fxUpdate(dt) {
  floats = floats.filter(f => (f.t -= dt * .9) > 0); floats.forEach(f => f.y -= dt * 24);
  parts = parts.filter(p => (p.t -= dt) > 0); parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; });
  shake = Math.max(0, shake - dt * 12); flash = Math.max(0, flash - dt * 2);
}
function fxDraw() {
  parts.forEach(p => R(p.x, p.y, 2, 2, p.c));
  floats.forEach(f => { const hw = tw(f.txt) / 2 + 2; text(f.txt, clamp(f.x, hw, W - hw), f.y, f.c, { c: 1, sh: '#000' }); });
}

/* ---------------------------------------------------------------- sprites */
function sprite(rows, pal) {
  return layer(r => rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = pal[row[x]]; if (c) r(x, y, 1, 1, c); } }), rows[0].length, rows.length);
}
const OUT = '#3a1f3f';
const HEAD_PAL = { K: OUT, r: '#d8304a', d: '#a81c3c', l: '#ff8a9a', h: '#ffe4e8', S: '#ffffff', E: '#240f2c', n: '#5c4028', m: OUT, B: '#78102c', g: '#7fc84a', G: '#3e8c34' };
const HEAD = sprite([
  '......gGg..n......',
  '...KgGGGgKnKKK....',
  '..KlgggrrKKrrrrK..',
  '.KlhlrrrrrrrrrrdK.',
  '.KhlrrrrrrrrrrrdK.',
  'KllrrrrrrrrrrrrrdK',
  'KlBBBBrrrrrrBBBBdK',
  'KrrSSEErrrrrSSErdK',
  'KrrddrrrrrrrddrrdK',
  'KrrrrrrrrrrrrrrrdK',
  '.KrrrrmmmmmmrrddK.',
  '.KdrrmrrrrrrmrddK.',
  '..KddrrrrrrrdddK..',
  '...KKdddddddKKK...',
  '.....KKKKKKK......'
], HEAD_PAL);
const MINI = sprite([
  '....g.n....',
  '..KKKnKKK..',
  '.KllrrrrrK.',
  'KlhrrrrrrdK',
  'KBBBrrrBBdK',
  'KrSErrrSEdK',
  'KrrrrrrrrdK',
  'KrrmmmmmrdK',
  '.KmrrrrrmK.',
  '..KKKKKKK..'
], HEAD_PAL);

function frutti(x, y, o = {}) {
  x = Math.round(x); y = Math.round(y);
  const st = o.step ? (Math.floor(o.step * 8) % 2) : -1;
  const lL = st === 0 ? 1 : 0, lR = st === 1 ? 1 : 0, fit = o.outfit;
  const LOOK = {
    deal: ['#2f3346', '#23242f'], fraud: ['#22304f', '#1a2640'], heist: ['#e8e8f0', '#15151f'],
    pimp: ['#6d2bb0', '#4c1a85'], gamble: ['#16161f', '#16161f']
  }[fit] || ['#f8f6ff', '#e8cf94'];
  const [top, legs] = LOOK, skin = '#d8304a';
  // canvas shoes
  R(x - 7, y - 3 - lL, 6, 3, OUT); R(x - 6, y - 3 - lL, 4, 2, '#fff8e8');
  R(x + 1, y - 3 - lR, 6, 3, OUT); R(x + 2, y - 3 - lR, 4, 2, '#fff8e8');
  // trousers
  R(x - 5, y - 10, 4, 7 - lL, legs); R(x + 1, y - 10, 4, 7 - lR, legs); R(x - 5, y - 11, 10, 2, legs); R(x - 1, y - 8, 1, 5, '#00000040');
  // shirt, rolled sleeves, bare forearms
  R(x - 6, y - 17, 12, 7, top);
  R(x - 8, y - 17, 2, 3, top); R(x + 6, y - 17, 2, 3, top);
  R(x - 8, y - 14, 2, 4, skin); R(x + 6, y - 14, 2, 4, skin); R(x - 8, y - 10, 2, 2, '#a81c3c'); R(x + 6, y - 10, 2, 2, '#a81c3c');
  if (!fit) { R(x, y - 15, 1, 5, '#e8dec6'); R(x - 2, y - 16, 4, 1, skin); }
  if (fit === 'dogs') { R(x, y - 15, 1, 1, '#e8dec6'); R(x - 5, y - 15, 10, 8, '#ffffff'); R(x - 5, y - 15, 10, 1, '#d8304a'); }
  if (fit === 'deal') { R(x - 2, y - 13, 4, 2, '#454b66'); }
  if (fit === 'pimp') { R(x - 9, y - 17, 18, 13, '#6d2bb0'); R(x - 10, y - 17, 3, 13, '#ff8fc0'); R(x + 7, y - 17, 3, 13, '#ff8fc0'); R(x - 10, y - 5, 20, 2, '#ff8fc0'); R(x - 3, y - 16, 6, 1, '#ffe680'); R(x - 1, y - 15, 2, 2, '#ffe680'); }
  if (fit === 'heist') { for (let i = 0; i < 3; i++) R(x - 6, y - 16 + i * 2, 12, 1, '#15151f'); }
  if (fit === 'fraud') { R(x - 2, y - 17, 4, 6, '#ffffff'); R(x - 1, y - 17, 2, 6, '#d8304a'); }
  if (fit === 'gamble') { R(x - 2, y - 17, 4, 7, '#ffffff'); R(x - 2, y - 17, 4, 2, '#ffe680'); }
  // head
  g.drawImage(HEAD, x - 9, y - 31);
  const eye = y - 24;
  if (fit === 'dogs') { R(x - 7, y - 34, 14, 5, '#ffffff'); R(x - 7, y - 31, 14, 1, '#d8304a'); R(x - 5, y - 36, 10, 2, '#ffffff'); }
  if (fit === 'deal') { R(x - 8, y - 33, 16, 5, '#2f3346'); R(x - 8, y - 30, 16, 1, '#454b66'); R(x - 8, eye, 7, 2, '#0a0a10'); R(x + 1, eye, 7, 2, '#0a0a10'); R(x - 1, eye, 2, 1, '#0a0a10'); }
  if (fit === 'pimp') {
    R(x - 14, y - 32, 28, 2, '#9a4ce8'); R(x - 7, y - 38, 14, 6, '#8a3fd8'); R(x - 7, y - 34, 14, 2, '#ffe680');
    R(x + 6, y - 43, 2, 7, '#ff8fc0'); R(x + 8, y - 44, 1, 4, '#ff8fc0');

function gameDogs(run) {

function makeSig() { const pts = []; for (let i = 0; i < 8; i++) pts.push([3 + i * 6, 2 + Math.floor(Math.random() * 11)]); return pts; }

function gameFraud(run) {
  let target, check = null, fuse = 0, fuseMax = 3.4, n = 0, mult = 1, sinceTarget = 0, anim = 0, t = 0, outcome = null, cool = 0, typeT = 0;
  function newTarget() {

    target = { name: names[0], alt: names[1], bank: Math.floor(Math.random() * 4), sig: makeSig() };
    sinceTarget = 0;
  }
  function newCheck() {
    const fake = Math.random() < .28 + Math.min(n * .01, .15);
    const c = { name: target.name, bank: target.bank, sig: target.sig, fake };

      const tell = Math.floor(Math.random() * 3);
      if (tell === 0) c.name = target.alt;
      if (tell === 1) c.bank = (target.bank + 1 + Math.floor(Math.random() * 3)) % 4;
      if (tell === 2) c.sig = fakeSig(target.sig);
    }
    c.amount = Math.max(1, Math.round(380 * Math.pow(1.14, n) * mult * run.pay));
    check = c; anim = 0; outcome = null;

  }
  newTarget(); newCheck();

        good = true; run.take += c.amount; pop('+' + money(c.amount), 210, 56); coins(210, 90, 12); sfx('coin');
      } else {
        run.heat = clamp(run.heat + .26, 0, 1); sfx('bad'); bump(5); flashOn('#ff2030', .45); pop('HONEYPOT! TRACE +26%', 210, 58, '#ff6a6a');
      }
    } else if (action === 'shred') {

    }
    if (good) n++;

        R(4, y, 170, 23, UI.ink); R(5, y + 1, 168, 21, on ? '#ffd6e8' : UI.white); R(5, y + 20, 168, 2, on ? UI.pink : '#d8d4f0');
        hustleIcon(h.id, 8, y + 3, t);
        text(h.name, 32, y + 3, UI.ink);
        text('RISK', 32, y + 9 + 1, '#5a5488'); bars(50, y + 10, h.risk, UI.deep);
        text('PAY', 32, y + 16, '#5a5488'); bars(50, y + 16, h.pay, '#2f9a5a');
        const lv = save.rep[h.id] || 1;
        if (h.id !== 'gamble') { text('REP', 96, y + 3, '#5a5488'); for (let k = 0; k < 5; k++) R(110 + k * 5, y + 4, 4, 3, k < lv ? UI.deep : '#d8d4f0'); }
        if (!open) text('NEED ' + money(h.buyIn), 170, y + 13, UI.deep, { r: 1 });
        else if (save.best[h.id]) text('BEST ' + money(save.best[h.id]), 170, y + 13, '#5a5488', { r: 1 });
      });
      const h = HUSTLES[sel];
      uiWindow(180, 19, 134, 141);
      R(216, 100, 62, 3, UI.ink);
      fruttiBig(247, 101, 2, { outfit: h.id, step: 0 });
      let yy = 106;
      wrap(h.blurb, 126).forEach(l => { text(l, 185, yy, UI.white); yy += 7; });
      yy += 1;
      wrap('BUSTED: ' + h.bust, 126).forEach(l => { text(l, 185, yy, UI.pink); yy += 7; });
      if (denied > 0) text('EARN SOME MONEY FIRST', 89, 170, UI.pink, { c: 1, sh: UI.ink });
      else if (Math.floor(t * 2) % 2 === 0) text('SPACE TO HUSTLE', 89, 170, UI.yellow, { c: 1, sh: UI.ink });
      text(confirmReset > 0 ? 'R AGAIN: CLEAR REP (KEEPS MONEY)' : 'R CLEAR REP   M ' + (muted ? 'UNMUTE' : 'MUTE'), W - 4, 170, confirmReset > 0 ? UI.pink : UI.white, { r: 1, sh: UI.ink });
    }
  };
}

function briefScene(h) {
  let t = 0;
  const lv = save.rep[h.id] || 1;
  return {
    update(dt) {
      t += dt;
      if (t > .15 && (hit.a || mouse)) { sfx('go'); go(playScene(h)); }
      if (hit.q) go(menuScene(HUSTLES.indexOf(h)));
    },
    draw() {
      g.drawImage(CHECKER, 0, 0);
      fruttiBig(56, 150, 3, { outfit: h.id, step: 0 });
      uiWindow(116, 12, 196, 156);
      text(h.name, 124, 20, UI.yellow, { s: 2, sh: UI.ink });
      text('RISK', 124, 38, UI.white); bars(144, 38, h.risk, UI.deep);
      text('PAY', 188, 38, UI.white); bars(204, 38, h.pay, '#7fe07a');
      if (h.id !== 'gamble') text('REP ' + lv, 248, 38, UI.yellow);
      let y = 52;
      h.how.forEach(l => { wrap(l, 180).forEach((ln, i) => { text((i ? '  ' : '\u2665 ') + ln, 124, y, UI.white); y += 8; }); y += 2; });
      y += 2;
      wrap('IF BUSTED: ' + h.bust, 180).forEach(l => { text(l, 124, y, UI.pink); y += 8; });
      if (Math.floor(t * 2.5) % 2 === 0) text('SPACE TO START', 124, 157, '#7fe07a');
      text('Q BACK', 304, 157, UI.white, { r: 1 });
    }
  };
}

function playScene(h) {
  const lvl = save.rep[h.id] || 1;
  const run = {
    h, lvl, take: 0, stake: 0, heat: 0, pay: (1 + .35 * (lvl - 1)) * h.rate, spd: 1 + .1 * (lvl - 1), time: h.time, done: null, msg: '', label: null,
    bust(msg) { if (this.done) return; this.done = 'bust'; this.msg = msg; endT = 1.5; sfx('bust'); bump(7); flashOn('#ff2030', .7); },
    finish(msg) { if (this.done) return; this.done = 'clean'; this.msg = msg; endT = 1.2; sfx('win'); flashOn('#7fe07a', .3); }
  };
  const game = GAMES[h.id](run);
  let cd = h.ownStake ? 0 : 1.5, endT = 0, last = 3, isP = false;
  return {
    isPaused: () => isP,
    onBlur() { if (!run.done && cd <= 0) isP = true; },
    update(dt) {
      if (isP) {
        if (hit.p || hit.a) isP = false;
        if (hit.q) go(menuScene(HUSTLES.indexOf(h)));
        return;
      }
      if (hit.p && !run.done) { isP = true; return; }
      fxUpdate(dt);
      if (cd > 0) {
        cd -= dt;
        const n = Math.ceil(cd / .5);
        if (n !== last && n > 0) { last = n; sfx('tick'); }
        if (cd <= 0) sfx('go');
        return;
      }
      if (run.done) { endT -= dt; if (endT <= 0) go(resultScene(run)); return; }
      game.update(dt);
      if (run.time != null && !run.done) {
        const before = Math.ceil(run.time);
        run.time -= dt;
        if (Math.ceil(run.time) !== before && run.time <= 5 && run.time > 0) sfx('tick');
        if (run.time <= 0) { run.time = 0; run.finish("TIME'S UP!"); }
      }
    },
    draw() {
      game.draw();
      fxDraw();
      // HUD
      R(0, 0, W, 13, UI.win); R(0, 13, W, 1, UI.white);
      text(h.name, 3, 4, UI.yellow, { sh: UI.ink });
      if (h.id === 'gamble') text(money(getMoney()) + ' LEFT IN YOUR POCKET', W - 3, 4, UI.pink, { r: 1, sh: UI.ink });
      else {
        text(money(run.take), 104, 4, UI.pink, { c: 1, sh: UI.ink });
        const lab = { dogs: 'STRIKES', deal: 'HEAT', pimp: 'HEAT', heist: 'ALARM', fraud: 'TRACE' }[h.id];
        text(lab, 150, 4, UI.white, { sh: UI.ink });
        const hx = 150 + tw(lab) + 3, hw = 54;
        R(hx, 4, hw, 5, UI.ink); R(hx, 4, hw * run.heat, 5, run.heat > .66 ? (Math.floor(performance.now() / 120) % 2 ? UI.deep : UI.yellow) : run.heat > .33 ? UI.yellow : '#7fe07a');
        if (run.time != null) text(Math.ceil(run.time) + 'S', W - 3, 4, run.time <= 5 ? UI.pink : UI.white, { r: 1, sh: UI.ink });
      }
      if (cd > 0) {
        const n = Math.ceil(cd / .5);
        R(0, 70, W, 34, '#1c1440cc');
        text(n > 0 ? n : 'GO', W / 2, 78, UI.yellow, { s: 4, c: 1, sh: UI.ink });
      }
      if (run.done) {
        const b = run.done === 'bust';
        uiWindow(20, 72, W - 40, 34);
        text(b ? 'BUSTED!' : run.msg, W / 2, 78, b ? UI.pink : UI.yellow, { s: 3, c: 1, sh: UI.ink });
        if (b) text(run.msg, W / 2, 98, UI.white, { c: 1 });
      }
      if (isP) {
        uiWindow(50, 52, 220, 66);
        text('PAUSED', W / 2, 60, UI.yellow, { s: 3, c: 1, sh: UI.ink });
        text('SPACE: BACK TO WORK', W / 2, 92, '#fff', { c: 1 });
        text('Q: WALK AWAY AND LOSE THE TAKE', W / 2, 102, UI.pink, { c: 1 });
      }
    }
  };
}

function resultScene(run) {
  const h = run.h, bust = run.done === 'bust';
  const before = getMoney();
  let fine = 0, paid = 0;
  if (bust) {
    fine = Math.min(before + (h.keep ? run.take : 0), Math.max(Math.round(before * h.finePct), h.fineMin));
    if (h.keep) paid = run.take;
    setMoney(before + paid - fine);
    save.rep[h.id] = 1; save.busts = (save.busts || 0) + 1;
  } else {
    paid = run.stake + Math.round(run.take);
    addMoney(paid);
    if (!h.ownStake) save.rep[h.id] = Math.min(5, (save.rep[h.id] || 1) + 1);
    if (run.take > (save.best[h.id] || 0)) save.best[h.id] = Math.round(run.take);
  }
  persist();
  const after = getMoney(), newRep = save.rep[h.id];
  night.run++;
  const rain = heartRain(bust ? 0 : Math.round(Math.min(40, 6 + Math.log10(paid + 1) * 6))); let t = 0, shown = before, drop = 0;
  if (bust) sfx('bust'); else if (paid > 0) sfx('win');
  return {
    update(dt) {
      t += dt; rain.update(dt); drop = Math.min(1, drop + dt * 2.2);
      const k = clamp((t - .5) / .9, 0, 1); shown = before + (after - before) * k;
      if (t > .6 && (hit.a || mouse)) {
        sfx('ok');
        go(night.run >= RUNS_PER_NIGHT ? nightScene() : menuScene(HUSTLES.indexOf(h)));
      }
    },
    draw() {
      g.drawImage(CHECKER, 0, 0);
      rain.draw();
      if (bust) for (let i = 0; i < 6; i++) { R(226, 30 + i * 24, 94, 1, '#5a5488'); text((6 - i) + 'FT', 300, 24 + i * 24, '#5a5488'); }
      portrait(204, 14, bust ? 'cry' : 'smug');
      if (bust) {
        const by = -150 + drop * 150;
        for (let i = 0; i < 9; i++) { R(226 + i * 12, by, 3, 180, '#8a90b0'); R(226 + i * 12, by, 1, 180, UI.white); }
        R(226, by + 70, 94, 4, '#8a90b0');
      }
      uiWindow(10, 12, 216, 156);
      text(bust ? 'BUSTED' : 'CLEAN', 18, 20, bust ? UI.pink : UI.yellow, { s: 4, sh: UI.ink });
      text(run.msg, 18, 45, UI.white);
      let y = 58;
      const line = (a, b, c) => { text(a, 18, y, UI.white); text(b, 216, y, c, { r: 1 }); y += 10; };
      const minus = n => '-' + money(n), plus = n => '+' + money(n);
      if (run.stake) line(bust ? 'BET LOST' : 'BET BACK', (bust ? minus : plus)(run.stake), bust ? UI.pink : '#7fe07a');
      if (bust && !h.keep && run.take) line('SEIZED', minus(run.take), UI.pink);
      if (!bust || h.keep) line('THE TAKE', plus(run.take), '#7fe07a');
      if (bust && fine) line(h.finePct ? 'BAIL (' + Math.round(h.finePct * 100) + '% OF MONEY)' : 'FINE', minus(fine), UI.pink);
      R(18, y, 198, 1, UI.white); y += 4;
      text('MONEY', 18, y, UI.pink, { s: 2, sh: UI.ink }); text(money(shown), 216, y, UI.yellow, { s: 2, r: 1, sh: UI.ink }); y += 16;
      if (h.id !== 'gamble') { text(bust ? 'REP RESET TO 1' : 'REP ' + newRep + ': PAYS MORE, MOVES FASTER', 18, y, bust ? UI.pink : UI.yellow); y += 8; }
      if (after === 0) text('FLAT BROKE. HOT DOGS ARE ALWAYS HIRING.', 18, y, UI.pink);
      if (t > .6 && Math.floor(t * 2.5) % 2 === 0) text('SPACE: ' + (night.run >= RUNS_PER_NIGHT ? 'END THE NIGHT' : 'NEXT HUSTLE'), 18, 158, UI.white);
    }
  };
}

/* The end of a night: reports the score, which the site keeps if it's a new best. */
function nightScene() {
  const earned = Math.max(0, getMoney() - night.start), score = Math.round(clamp(earned / SCORE_TARGET, 0, 1) * 100);
  if (embedded) toSite({ type: 'finish', score });
  const rain = heartRain(score >= 70 ? 30 : 6); let t = 0;
  sfx(score >= 40 ? 'win' : 'bad');
  return {
    update(dt) {
      t += dt; rain.update(dt);
      if (t > .6 && (hit.a || mouse)) {
        sfx('ok');
        if (embedded) toSite({ type: 'leave' }); else go(titleScene());
      }
    },
    draw() {
      g.drawImage(CHECKER, 0, 0);
      rain.draw();
      portrait(204, 14, score >= 40 ? 'smug' : 'grump');
      uiWindow(10, 12, 216, 156);
      text('NIGHT OVER', 18, 20, UI.yellow, { s: 3, sh: UI.ink });
      text('EARNED TONIGHT', 18, 50, UI.white); text(money(earned), 216, 50, '#7fe07a', { r: 1 });
      text('TOTAL MONEY', 18, 60, UI.white); text(money(getMoney()), 216, 60, UI.yellow, { r: 1 });
      R(18, 71, 198, 1, UI.white);
      text('SCORE', 18, 78, UI.pink, { s: 2, sh: UI.ink }); text(score, 216, 78, UI.yellow, { s: 2, r: 1, sh: UI.ink });
      for (let i = 0; i < 5; i++) text('\u2665', 18 + i * 8, 96, i < Math.round(score / 20) ? UI.pink : UI.ink);
      wrap(score >= 70 ? 'THAT BUYS A REAL RING. SHE IS GOING TO CRY.' : score >= 40 ? 'SILVER RING MONEY. NOT BAD FOR A NIGHT.' : 'CANDY RINGS ARE ALSO A KIND OF RING.', 198).forEach((l, i) => text(l, 18, 108 + i * 8, UI.white));
      text('THE PROPOSAL COSTS UP TO ' + money(BUDGET), 18, 130, UI.pink);
      if (t > .6 && Math.floor(t * 2.5) % 2 === 0) text(embedded ? 'SPACE: BACK TO THE ARCADE' : 'SPACE: NEW NIGHT', 18, 158, UI.white);
    }
  };
}

/* ---------------------------------------------------------------- main loop */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (hit.m) { muted = !muted; if (master) master.gain.value = muted ? 0 : .5; }
  if (wipe > 0) wipe = Math.max(0, wipe - dt * 4);
  scene.update(dt);
  const sx = shake > 0 ? Math.round(rand(-shake, shake)) : 0, sy = shake > 0 ? Math.round(rand(-shake, shake)) : 0;
  g.setTransform(1, 0, 0, 1, sx, sy);
  scene.draw();
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) { g.globalAlpha = flash; R(0, 0, W, H, flashCol); g.globalAlpha = 1; }
  if (wipe > 0 && !reduced) { const c = 12; for (let i = 0; i < c; i++) R(0, i * H / c, W * wipe, H / c + 1, '#000'); }
  for (const k in hit) hit[k] = false;
  mouse = null;
  requestAnimationFrame(frame);
}
if (embedded) startNight();
go(embedded ? menuScene() : titleScene());
requestAnimationFrame(frame);
cv.focus();
</script>
